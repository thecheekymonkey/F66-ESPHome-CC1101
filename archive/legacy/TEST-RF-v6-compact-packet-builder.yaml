          command_name: "Reverse"

  - platform: template
    name: "LAB Generated Timer 1H"
    icon: "mdi:timer-outline"
    entity_category: diagnostic
    on_press:
      - script.execute:
          id: send_f66
          command_code: 149
          command_name: "Timer 1H"

  - platform: template
    name: "LAB Generated Timer 2H"
    icon: "mdi:timer-outline"
    entity_category: diagnostic
    on_press:
      - script.execute:
          id: send_f66
