##############################################################################
#
# F66 Ceiling Fan Controller
#
# Version : 4.0.0 (Production)
#
# Platform : ESP32-S3 DevKitC-1 + CC1101
#
# RF Protocol :
#   Literal replay of verified OEM F66 remote captures.
#
# Expansion :
#   GPIO4  - SDA (Reserved for future BME680)
#   GPIO5  - SCL (Reserved for future BME680)
#
##############################################################################

esphome:
  name: f66-ceiling-fan-controller
  friendly_name: F66 Ceiling Fan Controller

  on_boot:
    priority: -100
    then:
      - delay: 2s
      - cc1101.reset:
          id: radio
      - cc1101.begin_rx:
          id: radio
      - text_sensor.template.publish:
          id: rf_status
          state: "READY - literal captured frames"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Ceiling-Fan-Literal-Fallback"
    password: ""

captive_portal:

api:
  batch_delay: 0ms

ota:
  - platform: esphome

web_server:
  port: 80

logger:
  level: INFO

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

cc1101:
  id: radio
  cs_pin: GPIO10
  frequency: 433.92MHz
  output_power: 10
  modulation_type: "ASK/OOK"
  symbol_rate: 2400
  filter_bandwidth: 200kHz

remote_transmitter:
  id: rf_tx
  pin:
    number: GPIO14
    inverted: false
  carrier_duty_percent: 100%
  clock_resolution: 1000000
  use_dma: true
  rmt_symbols: 256
  non_blocking: false
  eot_level: false

remote_receiver:
  id: rf_rx
  pin:
    number: GPIO9
    mode:
      input: true
      pullup: false
  dump:
    - raw
  tolerance:
    type: percentage
    value: 35%
  filter: 100us
  idle: 10ms
  buffer_size: 20kB
  clock_resolution: 1000000
  use_dma: true
  rmt_symbols: 256
  filter_symbols: 20

# ---------------------------------------------------------------------------
# Reserved I²C Expansion
#
# Planned future sensor:
#   - BME680 environmental sensor
#
# Reserved pins:
#   GPIO4  SDA
#   GPIO5  SCL
#
# (No I²C bus is enabled in V4 to preserve the verified firmware.)
# ---------------------------------------------------------------------------


globals:
  - id: frequency_hz
    type: float
    restore_value: no
    initial_value: "433920000.0f"

  - id: symbol_rate_baud
    type: float
    restore_value: no
    initial_value: "2400.0f"

  - id: repeat_count
    type: int
    restore_value: no
    initial_value: "4"

  - id: tx_settle_us
    type: int
    restore_value: no
    initial_value: "1000"

text_sensor:
  - platform: template
    name: "RF Status"
    id: rf_status
    icon: "mdi:radio-tower"

  - platform: template
    name: "RF Transmission Profile"
    id: rf_profile
    icon: "mdi:tune-variant"

binary_sensor:
  - platform: status
    name: "Controller Status"

select:
  - platform: template
    name: "RF Frequency"
    id: frequency_select
    optimistic: true
    restore_value: false
    initial_option: "433.920 MHz"
    options:
      - "433.870 MHz"
      - "433.920 MHz"
      - "433.970 MHz"
    set_action:
      - lambda: |-
          if (x == "433.870 MHz") id(frequency_hz) = 433870000.0f;
          else if (x == "433.970 MHz") id(frequency_hz) = 433970000.0f;
          else id(frequency_hz) = 433920000.0f;

  - platform: template
    name: "RF CC1101 Symbol Rate"
    id: symbol_rate_select
    optimistic: true
    restore_value: false
    initial_option: "2400 baud"
    options:
      - "600 baud"
      - "1200 baud"
      - "2400 baud"
      - "4800 baud"
    set_action:
      - lambda: |-
          if (x == "600 baud") id(symbol_rate_baud) = 600.0f;
          else if (x == "1200 baud") id(symbol_rate_baud) = 1200.0f;
          else if (x == "4800 baud") id(symbol_rate_baud) = 4800.0f;
          else id(symbol_rate_baud) = 2400.0f;

  - platform: template
    name: "RF Repeat Count"
    id: repeats_select
    optimistic: true
    restore_value: false
    initial_option: "4"
    options:
      - "4"
      - "8"
      - "16"
    set_action:
      - lambda: id(repeat_count) = atoi(x.c_str());

  - platform: template
    name: "RF TX Settling"
    id: settle_select
    optimistic: true
    restore_value: false
    initial_option: "1000 us"
    options:
      - "0 us"
      - "500 us"
      - "1000 us"
      - "2000 us"
    set_action:
      - lambda: |-
          if (x == "0 us") id(tx_settle_us) = 0;
          else if (x == "500 us") id(tx_settle_us) = 500;
          else if (x == "2000 us") id(tx_settle_us) = 2000;
          else id(tx_settle_us) = 1000;

script:
  - id: restore_recommended
    mode: restart
    then:
      - lambda: |-
          id(frequency_hz) = 433920000.0f;
          id(symbol_rate_baud) = 2400.0f;
          id(repeat_count) = 4;
          id(tx_settle_us) = 1000;
      - select.set:
          id: frequency_select
          option: "433.920 MHz"
      - select.set:
          id: symbol_rate_select
          option: "2400 baud"
      - select.set:
          id: repeats_select
          option: "4"
      - select.set:
          id: settle_select
          option: "1000 us"
      - text_sensor.template.publish:
          id: rf_status
          state: "Recommended literal profile restored"

  - id: send_literal
    mode: queued
    max_runs: 10
    parameters:
      frame_id: int
      command_name: string
    then:
      - text_sensor.template.publish:
          id: rf_status
          state: !lambda |-
            return std::string("Sending: ") + command_name;
      - lambda: |-
          char text[180];
          snprintf(text, sizeof(text),
            "%s | literal frame %d | %.3fMHz | %.0f baud | x%d | settle %dus",
            command_name.c_str(), frame_id,
            id(frequency_hz) / 1000000.0f,
            id(symbol_rate_baud),
            id(repeat_count),
            id(tx_settle_us));
          ESP_LOGI("f66", "%s", text);
          id(rf_profile).publish_state(text);
      - cc1101.set_idle:
          id: radio
      - cc1101.set_frequency:
          id: radio
          value: !lambda return id(frequency_hz);
      - cc1101.set_symbol_rate:
          id: radio
          value: !lambda return id(symbol_rate_baud);
      - cc1101.set_output_power:
          id: radio
          value: 10
      - cc1101.begin_tx:
